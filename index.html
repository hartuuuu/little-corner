<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>little corner</title>

    <meta name="description" content="A tiny place on the internet. Take whatever you need. Leave whenever you want.">

    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Background decoration -->
    <div class="background-blur blur1"></div>
    <div class="background-blur blur2"></div>

    <main class="container">

        <section class="card">

            <!-- Top -->

            <div class="top">

                <p id="emoji" class="emoji">:)</p>

                <h1 id="title">
                    little corner
                </h1>

                <p id="subtitle" class="subtitle">
                    Take whatever you need.
                    <br>
                    Leave whenever you want.
                </p>

            </div>

            <!-- Message -->

            <div id="content" class="content">

                <span id="category" class="category">
                    Welcome
                </span>

                <h2 id="message" class="message">

                    You found a little corner of the internet.

                    <br><br>

                    It doesn't promise to change your life.

                    <br><br>

                    Maybe it'll change your next ten seconds.

                </h2>

            </div>

            <!-- Button -->

            <button id="randomBtn">

                Open something

            </button>

            <!-- Footer -->

            <div class="footer">

                <p id="footerText">

                    made with curiosity.

                </p>

            </div>

        </section>

    </main>

    <script src="content.js"></script>
    <script src="script.js"></script>

</body>

</html>
